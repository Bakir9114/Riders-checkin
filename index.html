<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RCIS (Rider Check-In System)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #0f172a;
            background-image: radial-gradient(circle at top right, #1e293b 0%, #0f172a 50%, #020617 100%);
            background-attachment: fixed;
        }
        
        /* Modern Glassmorphism */
        .glass-card { 
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* Input styling */
        .premium-input {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .premium-input:focus {
            background: rgba(30, 41, 59, 0.9);
            border-color: #0ea5e9;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.3);
            outline: none;
        }

        /* Animations */
        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .animate-fade-in { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .live-dot { animation: pulse-ring 2s infinite; }

        /* Camera & Scanner Effects */
        #camera-feed { transform: scaleX(-1); max-width: 100%; border-radius: 1rem; }
        .camera-container {
            position: relative;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.8), 0 10px 25px rgba(0,0,0,0.5);
        }
        .scanner-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #0ea5e9;
            box-shadow: 0 0 15px 2px #0ea5e9, 0 0 30px #0ea5e9;
            animation: scan 3s linear infinite;
            z-index: 10;
            opacity: 0.8;
        }
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Loaders and Scrollbars */
        .loader { border: 3px solid rgba(255, 255, 255, 0.1); border-radius: 50%; border-top: 3px solid #0ea5e9; width: 28px; height: 28px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.2); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: rgba(255,255,255,0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 text-gray-200">
    
    <div class="glass-card flex flex-col items-center p-8 sm:p-10 rounded-[2rem] max-w-2xl w-full animate-fade-in">
        
        <!-- App Logo/Header -->
        <div class="mb-8 flex flex-col items-center">
            <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-cyan-400 rounded-2xl shadow-lg shadow-cyan-500/30 flex items-center justify-center mb-4 transform -rotate-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white transform rotate-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-center tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-cyan-300 to-teal-300">
                Rider Check-In
            </h1>
            <p class="text-slate-400 text-sm mt-2 font-medium tracking-wide uppercase">Farmako Delivery System</p>
        </div>

        <!-- Login Section -->
        <div id="login-section" class="w-full max-w-md text-center">
            <div class="space-y-5">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                    </div>
                    <input type="text" id="rider-id" placeholder="Rider ID (e.g. FAR001)"
                           class="premium-input w-full pl-12 pr-4 py-4 text-lg rounded-2xl text-white placeholder-slate-500 uppercase tracking-widest font-semibold">
                </div>
                
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                    </div>
                    <input type="password" id="rider-pin" placeholder="Secret PIN"
                           class="premium-input w-full pl-12 pr-12 py-4 text-lg rounded-2xl text-white placeholder-slate-500 font-semibold tracking-widest">
                    <button onclick="togglePinVisibility()" type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-cyan-400 transition-colors">
                        <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                        <svg id="eye-slash-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>
                    </button>
                </div>
            </div>
            
            <button id="login-btn" onclick="loginRider()"
                   class="mt-8 w-full px-8 py-4 text-xl font-bold text-white bg-gradient-to-r from-blue-600 to-cyan-500 rounded-2xl shadow-[0_10px_25px_-5px_rgba(6,182,212,0.4)] transition-all duration-300 hover:shadow-[0_15px_35px_-5px_rgba(6,182,212,0.6)] transform hover:-translate-y-1 active:scale-95 flex justify-center items-center">
                Secure Login
                <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </div>

        <!-- Manager Dashboard Section -->
        <div id="manager-section" class="hidden w-full max-w-md mx-auto text-center animate-fade-in">
            <div class="mb-6 flex justify-between items-center bg-slate-800/60 p-5 rounded-2xl border border-slate-700/50">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-indigo-500/20 flex items-center justify-center border border-indigo-500/50">
                        <svg class="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                    </div>
                    <div class="text-left">
                        <p class="text-xs text-slate-400 font-medium uppercase tracking-wider">Manager</p>
                        <p id="mgr-name" class="font-bold text-white text-lg leading-tight"></p>
                    </div>
                </div>
                <button type="button" onclick="logoutUser()" class="p-2 bg-slate-700/50 rounded-xl text-slate-300 hover:text-rose-400 hover:bg-rose-900/30 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>

            <div class="flex justify-between items-end mb-4 border-b border-slate-700 pb-3">
                <h2 class="text-xl font-bold text-white">Pending Requests</h2>
                <button type="button" onclick="fetchPendingApprovals()" id="mgr-refresh-btn" class="text-sm font-semibold text-cyan-400 hover:text-cyan-300 flex items-center transition-colors">
                    <svg id="refresh-icon" class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span id="mgr-refresh-text">Refresh</span>
                </button>
            </div>
            
            <div id="approvals-container" class="space-y-4 max-h-[60vh] overflow-y-auto pr-2 custom-scrollbar text-left">
                <!-- Requests load here -->
            </div>
        </div>

        <!-- Main Rider App Section -->
        <div id="app-section" class="hidden w-full text-center animate-fade-in">
            <!-- User Header -->
            <div id="user-info" class="mb-8 flex justify-between items-center bg-slate-800/60 p-5 rounded-2xl border border-slate-700/50 shadow-inner">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-cyan-500 to-blue-500 flex items-center justify-center text-white font-bold text-xl shadow-lg border-2 border-slate-700">
                        <span id="user-avatar-letter">R</span>
                    </div>
                    <div class="text-left">
                        <p class="text-xs text-slate-400 font-medium tracking-wide">WELCOME BACK</p>
                        <p id="user-name" class="font-bold text-white text-xl leading-tight"></p>
                    </div>
                </div>
                <button onclick="logoutUser()" class="p-3 bg-slate-700/50 rounded-xl text-slate-300 hover:text-rose-400 hover:bg-rose-900/30 transition-all hover:scale-105 active:scale-95">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
            
            <!-- Active Shift Badge -->
            <div id="active-shift-display" class="hidden mb-8 transform transition-all">
                <div class="inline-flex items-center space-x-2 bg-emerald-900/40 border border-emerald-500/30 px-4 py-2 rounded-full shadow-[0_0_15px_rgba(16,185,129,0.15)]">
                    <div class="w-3 h-3 bg-emerald-500 rounded-full live-dot"></div>
                    <span class="text-emerald-400 font-semibold text-sm tracking-wide">ACTIVE SHIFT: <span id="shift-time-text" class="text-white"></span></span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div id="buttons" class="hidden flex flex-col justify-center items-center space-y-5 w-full max-w-xs mx-auto">
                <button id="check-in-button" onclick="showForm('checkin')" 
                        class="w-full px-8 py-5 text-2xl font-extrabold text-white bg-gradient-to-br from-emerald-400 to-teal-600 rounded-2xl shadow-[0_15px_35px_-10px_rgba(16,185,129,0.5)] transition-all duration-300 hover:shadow-[0_20px_40px_-10px_rgba(16,185,129,0.7)] transform hover:-translate-y-1 active:scale-95 flex justify-center items-center space-x-2" style="display: none;">
                    <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" /></svg>
                    <span>Check-In</span>
                </button>
                
                <button id="check-out-button" onclick="showForm('checkout')" 
                        class="w-full px-8 py-5 text-2xl font-extrabold text-white bg-gradient-to-br from-rose-500 to-orange-500 rounded-2xl shadow-[0_15px_35px_-10px_rgba(244,63,94,0.5)] transition-all duration-300 hover:shadow-[0_20px_40px_-10px_rgba(244,63,94,0.7)] transform hover:-translate-y-1 active:scale-95 flex justify-center items-center space-x-2" style="display: none;">
                    <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                    <span>Check-Out</span>
                </button>
            </div>

            <!-- Forms Container -->
            <div id="forms-container" class="hidden w-full max-w-md mx-auto mt-6 animate-fade-in">
                 <div id="checkin-form" class="hidden flex flex-col space-y-5">
                    <div class="text-left">
                        <label for="shift-time-select" class="block text-sm font-semibold text-slate-300 mb-2 uppercase tracking-wide">Select Your Shift</label>
                        <div class="relative">
                            <select id="shift-time-select" class="premium-input w-full appearance-none rounded-xl text-lg font-medium">
                                <option value="" disabled selected>Tap to select shift...</option>
                                <option value="7 AM to 5 PM">7 AM to 5 PM</option>
                                <option value="8 AM to 6 PM">8 AM to 6 PM</option>
                                <option value="9 AM to 7 PM">9 AM to 7 PM</option>
                                <option value="4 PM to 2 AM">4 PM to 2 AM</option>
                                <option value="5 PM to 3 AM">5 PM to 3 AM</option>
                                <option value="8 PM to 6 AM">8 PM to 6 AM</option>
                                <option value="10 PM to 8 AM">10 PM to 8 AM</option>
                                <option value="Other (In Emergency Only)">Other (Emergency / OT)</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </div>
                        </div>
                    </div>
                    <button id="submit-checkin-btn" onclick="startVerification('checkin', this)" class="w-full py-4 text-lg font-bold text-white bg-gradient-to-r from-emerald-500 to-teal-500 rounded-xl shadow-lg hover:shadow-teal-500/30 transition-all transform hover:-translate-y-1">
                        Verify Location & Continue
                    </button>
                    <button onclick="hideForms()" class="text-slate-400 font-medium hover:text-white transition-colors">Go Back</button>
                </div>

                <div id="checkout-form" class="hidden flex flex-col space-y-4">
                    <h2 class="text-2xl font-bold text-white mb-2 border-b border-slate-700/50 pb-2">End of Shift Details</h2>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-slate-400 font-semibold mb-1 text-left uppercase">Total Rides *</label>
                            <input type="number" id="total-rides" placeholder="0" class="premium-input w-full rounded-xl text-center text-xl font-bold">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 font-semibold mb-1 text-left uppercase">Total KMs *</label>
                            <input type="number" id="total-kms" placeholder="0.0" class="premium-input w-full rounded-xl text-center text-xl font-bold">
                        </div>
                    </div>
                    
                    <div class="text-left mt-2">
                        <label class="block text-xs text-slate-400 font-semibold mb-1 uppercase">Is this your Last Order? *</label>
                        <select id="last-order" onchange="toggleOrderIdField()" class="premium-input w-full rounded-xl text-lg font-medium">
                            <option value="" disabled selected>Select Yes / No</option>
                            <option value="Yes">Yes, this is the last one</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    
                    <div id="order-id-container" class="hidden text-left transition-all duration-300">
                        <label class="block text-xs text-rose-400 font-semibold mb-1 uppercase">Order ID Number *</label>
                        <input type="text" id="order-id" placeholder="Enter Order #" class="w-full bg-rose-900/20 border border-rose-500/50 focus:border-rose-400 focus:ring-1 focus:ring-rose-400 rounded-xl px-4 py-3 text-white transition-all outline-none font-bold">
                    </div>
                    
                    <div class="border-t border-slate-700/50 pt-4 mt-2">
                        <p class="text-xs text-slate-400 font-semibold mb-3 text-left uppercase">Optional Manual Data</p>
                        <div class="grid grid-cols-2 gap-4">
                            <input type="number" id="manual-orders" placeholder="Manual Orders" class="premium-input w-full rounded-xl text-center">
                            <input type="number" id="manual-kms" placeholder="Manual KMs" class="premium-input w-full rounded-xl text-center">
                        </div>
                    </div>
                    
                    <button id="submit-checkout-btn" onclick="startVerification('checkout', this)" class="w-full mt-4 py-4 text-lg font-bold text-white bg-gradient-to-r from-rose-500 to-orange-500 rounded-xl shadow-lg hover:shadow-rose-500/30 transition-all transform hover:-translate-y-1">
                        Verify Location & Check-Out
                    </button>
                    <button onclick="hideForms()" class="text-slate-400 font-medium hover:text-white transition-colors">Go Back</button>
                </div>
            </div>

            <!-- Approval Waiting -->
            <div id="approval-waiting-section" class="hidden mt-8 bg-amber-900/20 p-6 rounded-2xl border border-amber-500/30 shadow-xl max-w-md mx-auto text-center animate-fade-in backdrop-blur-md">
                <div class="loader mx-auto mb-4 border-t-amber-400"></div>
                <h3 class="text-xl font-bold text-amber-400 mb-2">Manager Approval Pending</h3>
                <div class="bg-slate-900/50 rounded-lg p-3 mb-4 inline-block">
                    <p class="text-sm font-semibold text-slate-300" id="approval-reason-text"></p>
                </div>
                <p class="text-xs text-slate-400 mb-6 px-4">Request sent to manager. Please stay on this screen. It will auto-update.</p>
                
                <div class="space-y-3">
                    <button type="button" id="refresh-status-btn" onclick="checkMyApprovalStatus(window.lastTypeSent, window.lastFormDataSent)" class="w-full py-3 bg-blue-600/20 text-blue-400 border border-blue-500/50 rounded-xl font-bold hover:bg-blue-600/40 transition-colors flex justify-center items-center">
                        <svg id="rider-refresh-icon" class="w-5 h-5 mr-2 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Manual Refresh Status
                    </button>
                    <button type="button" id="cancel-req-btn" onclick="cancelApprovalRequest()" class="w-full py-3 bg-slate-800 text-slate-400 rounded-xl font-semibold hover:bg-slate-700 transition-colors">Cancel Request</button>
                </div>
            </div>

            <!-- Camera -->
            <div id="selfie-section" class="hidden mt-6 flex flex-col items-center space-y-4 w-full max-w-md mx-auto animate-fade-in">
                <div class="flex items-center space-x-2 mb-2">
                    <div class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></div>
                    <h2 class="text-lg font-bold text-slate-200 tracking-wide uppercase">Live Verification</h2>
                </div>
                
                <div class="camera-container w-full bg-black">
                    <video id="camera-feed" autoplay playsinline class="w-full h-auto"></video>
                    <div class="scanner-line"></div>
                    
                    <!-- Viewfinder overlay -->
                    <div class="absolute inset-0 pointer-events-none border-[rgba(255,255,255,0.1)] border-[40px] rounded-xl mix-blend-overlay"></div>
                    <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
                        <div class="w-48 h-56 border-2 border-dashed border-white/40 rounded-[2rem]"></div>
                    </div>
                </div>
                
                <canvas id="photo-canvas" class="hidden"></canvas>
                
                <div class="flex w-full space-x-3 pt-2">
                    <button onclick="stopCamera()" class="w-1/3 py-4 text-lg font-bold text-slate-300 bg-slate-800/80 rounded-2xl hover:bg-slate-700 transition-colors">Cancel</button>
                    <button id="capture-btn" class="w-2/3 py-4 text-lg font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl shadow-[0_10px_25px_-5px_rgba(79,70,229,0.5)] transition-all transform hover:-translate-y-1 flex justify-center items-center space-x-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <span>Take Selfie</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Universal Modal -->
    <div id="custom-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity">
        <div class="glass-card p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center transform scale-100 animate-fade-in border border-white/10">
            <div id="modal-icon-container" class="w-16 h-16 mx-auto bg-blue-500/20 rounded-full flex items-center justify-center mb-4 border border-blue-500/30">
                <svg id="modal-icon" class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h3 id="modal-title" class="text-2xl font-bold text-white mb-2 tracking-tight"></h3>
            <p id="modal-message" class="text-base text-slate-300 mb-8 leading-relaxed"></p>
            <button id="modal-ok-button" onclick="hideModal()" class="w-full px-6 py-4 text-lg font-bold text-white bg-blue-600 hover:bg-blue-500 rounded-xl shadow-lg transition-colors duration-200">
                Got it
            </button>
        </div>
    </div>

    <script>
        // --- YOUR WEB APP URL ---
        const APPS_SCRIPT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzxMI5XFyh9XCrC19eHlz3eUrUQ-q7BUrK5YugtTx9fGa71zrMyl-lRuicMsZXZvPThng/exec';
        
        const OFFICE_LATITUDE = 28.460845;
        const OFFICE_LONGITUDE = 77.079439;
        const ALLOWED_RADIUS_METERS = 400; 

        let currentUser = null;
        let cameraStream = null;
        let currentActiveShift = null;
        let activeCheckInTime = null;
        
        let approvalPollingTimer = null;
        let managerPollingTimer = null;

        // --- INIT ---
        window.onload = async () => {
            const savedUser = localStorage.getItem('rcisCurrentUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                routeUser();
                
                if(currentUser && currentUser.role === 'rider') {
                    showModal('Syncing State', 'Please wait...', false);
                    await silentStateSync(); 
                    hideModal();
                }
            }
        };

        // --- CORE API METHOD (Robust with auto-retry) ---
        async function safeFetch(payload, maxRetries = 2, silentError = false) {
            payload.ts = new Date().getTime(); 
            for (let attempt = 0; attempt <= maxRetries; attempt++) {
                try {
                    const response = await fetch(APPS_SCRIPT_WEB_APP_URL, {
                        method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    const rawText = await response.text();
                    try {
                        const jsonData = JSON.parse(rawText);
                        if(jsonData.status === 'error' && jsonData.message && jsonData.message.includes('Server thoda busy hai')) {
                            throw new Error(jsonData.message); 
                        }
                        return jsonData;
                    } catch(parseErr) { throw new Error("Server temporary busy hai. Retrying..."); }
                } catch (error) {
                    if (attempt === maxRetries) {
                        if(!silentError) console.error("Fetch failed:", error);
                        throw new Error(error.message);
                    }
                    await new Promise(resolve => setTimeout(resolve, 1500));
                }
            }
        }

        function showModal(title, message, showOkBtn = true) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-ok-button').style.display = showOkBtn ? 'inline-block' : 'none';
            
            // Dynamic Icons based on title
            const iconContainer = document.getElementById('modal-icon-container');
            const icon = document.getElementById('modal-icon');
            iconContainer.className = 'w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-4 border';
            
            if(title.toLowerCase().includes('error') || title.toLowerCase().includes('failed') || title.toLowerCase().includes('rejected')) {
                iconContainer.classList.add('bg-rose-500/20', 'border-rose-500/30');
                icon.classList.add('text-rose-400');
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>';
            } else if(title.toLowerCase().includes('success') || title.toLowerCase().includes('approved') || title.toLowerCase().includes('done')) {
                iconContainer.classList.add('bg-emerald-500/20', 'border-emerald-500/30');
                icon.classList.add('text-emerald-400');
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>';
            } else {
                iconContainer.classList.add('bg-blue-500/20', 'border-blue-500/30');
                icon.classList.add('text-blue-400');
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>';
            }

            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function hideModal() { document.getElementById('custom-modal').classList.add('hidden'); }

        function togglePinVisibility() {
            const pinInput = document.getElementById('rider-pin');
            pinInput.type = pinInput.type === 'password' ? 'text' : 'password';
            document.getElementById('eye-icon').classList.toggle('hidden');
            document.getElementById('eye-slash-icon').classList.toggle('hidden');
        }

        function toggleOrderIdField() {
            const lastOrder = document.getElementById('last-order').value;
            const orderContainer = document.getElementById('order-id-container');
            const orderIdInput = document.getElementById('order-id');
            if (lastOrder === 'Yes') {
                orderContainer.classList.remove('hidden');
            } else {
                orderContainer.classList.add('hidden');
                orderIdInput.value = '';
            }
        }

        async function loginRider() {
            const riderId = document.getElementById('rider-id').value.trim().toUpperCase();
            const secretPin = document.getElementById('rider-pin').value.trim();
            const loginBtn = document.getElementById('login-btn');
            
            if (!riderId || !secretPin) {
                return showModal('Error', 'ID aur PIN dono daalein.');
            }

            // --- DEVICE LOCK LOGIC (ANTI-PROXY) ---
            const lockedTo = localStorage.getItem('rcisDeviceLock');
            if (lockedTo && lockedTo !== riderId) {
                return showModal('Security Alert', `Yeh phone already Rider ID: ${lockedTo} ke sath link hai. Ek phone se dusre rider ki ID login karna allowed nahi hai.`);
            }
            
            const origHTML = loginBtn.innerHTML;
            loginBtn.disabled = true; 
            loginBtn.innerHTML = '<div class="loader border-t-white mr-2"></div> Authenticating...';
            
            try {
                const result = await safeFetch({ action: 'login', riderId, secretPin });
                
                if (result && result.status === 'success' && result.data) {
                    currentUser = result.data;
                    
                    // Phone ko is Rider ID se hamesha ke liye lock kar do
                    if (currentUser.role === 'rider') {
                        localStorage.setItem('rcisDeviceLock', currentUser.riderId);
                    }
                    
                    localStorage.setItem('rcisCurrentUser', JSON.stringify(currentUser));
                    routeUser();
                    
                    if(currentUser.role === 'rider') {
                        showModal('Syncing Data', 'Please wait...', false);
                        await silentStateSync();
                        hideModal();
                    }
                } else {
                    showModal('Login Failed', result ? result.message : 'ID ya PIN galat hai.');
                }
            } catch (error) { 
                showModal('Error', 'Network issue: ' + error.message); 
            } finally { 
                loginBtn.disabled = false; 
                loginBtn.innerHTML = origHTML; 
            }
        }

        function logoutUser() {
            localStorage.removeItem('rcisCurrentUser'); 
            localStorage.removeItem('rcisShiftState');
            currentUser = null;
            if (managerPollingTimer) clearInterval(managerPollingTimer);
            if (approvalPollingTimer) clearInterval(approvalPollingTimer);
            window.location.reload();
        }

        function routeUser() {
            document.getElementById('login-section').classList.add('hidden');
            
            if (currentUser.role === 'manager') {
                document.getElementById('app-section').classList.add('hidden');
                document.getElementById('manager-section').classList.remove('hidden');
                document.getElementById('mgr-name').textContent = currentUser.riderName;
                
                fetchPendingApprovals();
                if (managerPollingTimer) clearInterval(managerPollingTimer);
                managerPollingTimer = setInterval(fetchPendingApprovals, 10000);
            } else {
                document.getElementById('manager-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('user-name').textContent = currentUser.riderName.split(' ')[0];
                document.getElementById('user-avatar-letter').textContent = currentUser.riderName.charAt(0).toUpperCase();
            }
        }

        async function silentStateSync() {
            try {
                const res = await safeFetch({ action: 'getShiftState', riderId: currentUser.riderId }, 2, true);
                if (res && res.status === 'success' && res.shiftState) {
                    localStorage.setItem('rcisShiftState', JSON.stringify(res.shiftState));
                } else {
                    // Fallback to clear state if backend specifically says no active shift
                    localStorage.removeItem('rcisShiftState');
                }
            } catch(e) { console.error("Sync failed", e); }
            
            // Only after getting backend response (or failing), render the UI
            loadRiderState(); 
        }

        function loadRiderState() {
            const stateStr = localStorage.getItem('rcisShiftState');
            document.getElementById('buttons').classList.remove('hidden'); 
            document.getElementById('forms-container').classList.add('hidden');
            document.getElementById('check-in-button').style.display = 'none';
            document.getElementById('check-out-button').style.display = 'none';
            document.getElementById('active-shift-display').classList.add('hidden');

            if (stateStr) {
                const state = JSON.parse(stateStr);
                if (state.isShiftActive) {
                    currentActiveShift = state.currentShift;
                    activeCheckInTime = state.checkInTime;
                    document.getElementById('check-out-button').style.display = 'flex';
                    document.getElementById('shift-time-text').innerText = currentActiveShift;
                    document.getElementById('active-shift-display').classList.remove('hidden');
                    return;
                }
            }
            
            currentActiveShift = null; 
            activeCheckInTime = null;
            document.getElementById('check-in-button').style.display = 'flex';
        }

        function showForm(type) {
            document.getElementById('buttons').classList.add('hidden');
            document.getElementById('forms-container').classList.remove('hidden');
            if (type === 'checkin') {
                document.getElementById('checkin-form').classList.remove('hidden'); 
                document.getElementById('checkout-form').classList.add('hidden');
            } else {
                document.getElementById('checkout-form').classList.remove('hidden'); 
                document.getElementById('checkin-form').classList.add('hidden');
            }
        }
        
        function hideForms() {
            document.getElementById('forms-container').classList.add('hidden'); 
            document.getElementById('buttons').classList.remove('hidden');
        }

        function getShiftTimeBounds(shiftStr, checkInTimestamp = null) {
            if (!shiftStr) return null;
            if (shiftStr.includes("Other")) {
                if (!checkInTimestamp) return null;
                let start = new Date(checkInTimestamp), end = new Date(checkInTimestamp);
                end.setHours(end.getHours() + 10); 
                return { start, end };
            }
            const match = shiftStr.match(/(\d{1,2})\s*(AM|PM)\s*to\s*(\d{1,2})\s*(AM|PM)/i);
            if (!match) return null;
            let startH = parseInt(match[1]), startM = match[2].toUpperCase(), endH = parseInt(match[3]), endM = match[4].toUpperCase();
            if (startM === 'PM' && startH !== 12) startH += 12; if (startM === 'AM' && startH === 12) startH = 0;
            if (endM === 'PM' && endH !== 12) endH += 12; if (endM === 'AM' && endH === 12) endH = 0;
            let now = new Date(), start = new Date(now), end = new Date(now); 
            start.setHours(startH, 0, 0, 0); end.setHours(endH, 0, 0, 0);
            if (end <= start) {
                if (now.getHours() < startH && now.getHours() < 12) start.setDate(start.getDate() - 1); 
                else end.setDate(end.getDate() + 1);
            }
            return { start, end };
        }

        function getFormData(type) {
            const data = {};
            if (type === 'checkin') {
                data.shiftTime = document.getElementById('shift-time-select').value;
                if (!data.shiftTime) { showModal('Missing Info', 'Kripya shift select karein.'); return null; }
            } else if (type === 'checkout') {
                data.totalRides = document.getElementById('total-rides').value;
                data.totalKms = document.getElementById('total-kms').value;
                const lastOrderRaw = document.getElementById('last-order').value;
                const orderId = document.getElementById('order-id').value.trim();
                
                if (!data.totalRides || !data.totalKms || !lastOrderRaw) {
                    showModal('Missing Info', 'Sabhi mandatory (*) fields bharein.'); return null;
                }
                if (lastOrderRaw === 'Yes') {
                    if (!orderId) { showModal('Missing Info', 'Kripya Order ID enter karein.'); return null; }
                    data.lastOrder = "Yes"; data.orderId = `Yes (ID: ${orderId})`; 
                } else { data.lastOrder = "No"; data.orderId = "N/A"; }
                data.lastOrderRaw = lastOrderRaw;
                data.manualOrders = document.getElementById('manual-orders').value || "";
                data.manualKms = document.getElementById('manual-kms').value || "";
            }
            return data;
        }

        function startVerification(type, btnElement) {
            const formData = getFormData(type);
            if (!formData) return;

            const origText = btnElement.innerHTML;
            btnElement.innerHTML = '<div class="loader border-t-white inline-block align-middle mr-2 w-5 h-5 border-2"></div> Processing...';
            btnElement.disabled = true;

            let shiftStr = type === 'checkin' ? formData.shiftTime : currentActiveShift;
            let bounds = getShiftTimeBounds(shiftStr, activeCheckInTime); 
            let now = new Date(), needsApproval = false, reason = "";

            if (type === 'checkin' && bounds) {
                let diffMins = (now - bounds.start) / 60000;
                if (diffMins > 20) { needsApproval = true; reason = `Late check-in by ${Math.floor(diffMins)} mins.`; }
            } else if (type === 'checkout' && bounds) {
                let diffMinsEarly = (bounds.end - now) / 60000;
                if (diffMinsEarly > 30 && formData.lastOrderRaw === 'No') {
                    needsApproval = true; reason = `Early check-out by ${Math.floor(diffMinsEarly)} mins without last order.`;
                }
            } else if (shiftStr && shiftStr.includes("Other")) {
                if (type === 'checkin') { needsApproval = true; reason = "Emergency/Other shift selected."; }
            }

            if (needsApproval) {
                requestManagerApproval(type, formData, reason, shiftStr, btnElement, origText);
            } else {
                btnElement.innerHTML = origText; btnElement.disabled = false;
                proceedToLocation(type, formData);
            }
        }

        async function requestManagerApproval(type, formData, reason, shiftStr, btnElement, origText) {
            try {
                await safeFetch({
                    action: 'requestApproval', riderId: currentUser.riderId, riderName: currentUser.riderName, type: type, reason: reason, shiftTime: shiftStr
                }, 2);
                hideForms();
                document.getElementById('approval-reason-text').innerText = reason;
                document.getElementById('approval-waiting-section').classList.remove('hidden');
                window.lastTypeSent = type; window.lastFormDataSent = formData;
                if(approvalPollingTimer) clearInterval(approvalPollingTimer);
                approvalPollingTimer = setInterval(() => checkMyApprovalStatus(type, formData), 5000);
            } catch(e) { showModal('Request Failed', 'Network error. Try again.'); } 
            finally { if(btnElement) { btnElement.innerHTML = origText; btnElement.disabled = false; } }
        }

        async function checkMyApprovalStatus(type, formData) {
            const rIcon = document.getElementById('rider-refresh-icon');
            if(rIcon) { rIcon.classList.remove('hidden'); rIcon.classList.add('animate-spin'); }
            try {
                const res = await safeFetch({ action: 'checkApprovalStatus', riderId: currentUser.riderId }, 0, true);
                if (res && res.status === 'success') {
                    if (res.approvalStatus === 'approved') {
                        if(approvalPollingTimer) clearInterval(approvalPollingTimer);
                        document.getElementById('approval-waiting-section').classList.add('hidden');
                        showModal('Approved!', 'Manager ne request approve kar di hai. Location verify ho rahi hai.', false);
                        setTimeout(() => { hideModal(); proceedToLocation(type, formData); }, 1500);
                    } else if (res.approvalStatus === 'rejected') {
                        if(approvalPollingTimer) clearInterval(approvalPollingTimer);
                        document.getElementById('approval-waiting-section').classList.add('hidden');
                        showModal('Rejected', 'Manager ne request deny kar di hai.');
                        document.getElementById('forms-container').classList.remove('hidden');
                    }
                }
            } catch(e) {} 
            finally { if(rIcon) { rIcon.classList.add('hidden'); rIcon.classList.remove('animate-spin'); } }
        }

        async function cancelApprovalRequest() {
            const cBtn = document.getElementById('cancel-req-btn');
            cBtn.disabled = true; cBtn.innerHTML = "Cancelling...";
            if (approvalPollingTimer) clearInterval(approvalPollingTimer);
            document.getElementById('approval-waiting-section').classList.add('hidden');
            document.getElementById('forms-container').classList.remove('hidden');
            try { await safeFetch({ action: 'cancelApproval', riderId: currentUser.riderId }, 1, true); } catch(e) {}
            cBtn.disabled = false; cBtn.innerHTML = "Cancel Request";
        }

        async function fetchPendingApprovals() {
            const refreshIcon = document.getElementById('refresh-icon');
            if (refreshIcon) refreshIcon.classList.add('animate-spin');
            try {
                const result = await safeFetch({ action: 'getPendingApprovals' }, 0, true); 
                const container = document.getElementById('approvals-container');
                container.innerHTML = '';
                if(result && result.status === 'success') {
                    if (result.data.length === 0) {
                        container.innerHTML = '<div class="p-6 text-center text-slate-400 bg-slate-800/50 rounded-xl border border-slate-700/50">All caught up! No pending requests.</div>';
                    } else {
                        result.data.forEach(data => {
                            const isCheckin = data.type === 'checkin';
                            container.innerHTML += `
                                <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg relative overflow-hidden group transition-all hover:border-slate-500">
                                    <div class="absolute top-0 left-0 w-1 h-full ${isCheckin ? 'bg-amber-400' : 'bg-emerald-400'}"></div>
                                    <div class="flex justify-between items-start mb-2 pl-3">
                                        <div>
                                            <p class="font-bold text-white text-lg">${data.riderName}</p>
                                            <p class="text-xs text-blue-400 font-mono bg-blue-900/30 px-2 py-1 rounded inline-block mt-1">${data.riderId}</p>
                                        </div>
                                        <span class="text-xs font-bold px-2 py-1 rounded-full ${isCheckin ? 'bg-amber-900/50 text-amber-400' : 'bg-emerald-900/50 text-emerald-400'} uppercase tracking-wide border ${isCheckin ? 'border-amber-500/30' : 'border-emerald-500/30'}">
                                            ${data.type}
                                        </span>
                                    </div>
                                    <div class="pl-3 mt-3">
                                        <p class="text-sm text-slate-300 bg-slate-900/80 p-3 rounded-lg border border-slate-700/50 italic flex items-start">
                                            <svg class="w-4 h-4 mr-2 text-rose-400 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                            ${data.reason}
                                        </p>
                                        <p class="text-xs text-slate-400 mt-2 font-medium">Shift: ${data.shiftTime}</p>
                                    </div>
                                    <div class="flex space-x-3 mt-4 pl-3">
                                        <button onclick="respondApproval(this, ${data.rowNumber}, 'approved')" class="flex-1 py-3 font-bold bg-emerald-600/20 text-emerald-400 border border-emerald-500/50 rounded-xl hover:bg-emerald-600 hover:text-white transition-all transform hover:-translate-y-0.5 shadow-sm hover:shadow-emerald-500/30">Approve</button>
                                        <button onclick="respondApproval(this, ${data.rowNumber}, 'rejected')" class="flex-1 py-3 font-bold bg-rose-600/20 text-rose-400 border border-rose-500/50 rounded-xl hover:bg-rose-600 hover:text-white transition-all transform hover:-translate-y-0.5 shadow-sm hover:shadow-rose-500/30">Reject</button>
                                    </div>
                                </div>
                            `;
                        });
                    }
                }
            } catch(e) {} finally { if (refreshIcon) refreshIcon.classList.remove('animate-spin'); }
        }

        window.respondApproval = async function(btn, rowNum, statusResponse) {
            const originalText = btn.innerHTML;
            btn.innerHTML = '<div class="loader border-t-current w-4 h-4 mr-1 inline-block align-middle border-2"></div>'; 
            btn.disabled = true;
            try {
                const res = await safeFetch({ action: 'respondApproval', rowNumber: rowNum, statusResponse: statusResponse }, 1);
                if(res && res.status === 'success') fetchPendingApprovals(); 
                else showModal('Error', res ? res.message : 'Unknown error');
            } catch(e) { showModal('Error', e.message); } 
            finally { btn.innerHTML = originalText; btn.disabled = false; }
        };

        function proceedToLocation(type, formData) {
            showModal('Acquiring Signal', 'Verifying GPS coordinates...', false);
            getLocation().then(async location => {
                showModal('Mapping Location', 'Translating coordinates...', false);
                const address = await getAddressFromCoordinates(location.latitude, location.longitude);
                startCamera(type, formData, location, address);
            }).catch(error => { 
                showModal('GPS Error', error); 
                document.getElementById('forms-container').classList.remove('hidden');
            });
        }

        function getLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) return reject('GPS is not supported on this device.');
                
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        const { latitude, longitude } = pos.coords;
                        const dist = calculateDistance(latitude, longitude, OFFICE_LATITUDE, OFFICE_LONGITUDE);
                        if (dist <= ALLOWED_RADIUS_METERS) resolve({ latitude, longitude });
                        else reject(`Out of range. You are approx ${dist.toFixed(0)} meters away from the office zone.`);
                    },
                    (error) => {
                        let errMsg = "Location Check Failed. \n";
                        if (error.code === error.PERMISSION_DENIED) {
                            errMsg += "Aapne Location permission deny kar di hai. Kripya browser settings me jaakar location 'Allow' karein.";
                        } else if (error.code === error.POSITION_UNAVAILABLE) {
                            errMsg += "Device ka GPS signal band hai ya nahi mil raha. Kripya phone ka Location/GPS ON karein.";
                        } else if (error.code === error.TIMEOUT) {
                            errMsg += "GPS lock hone me timeout ho gaya. Kripya kisi khuli jagah par jakar try karein.";
                        } else {
                            errMsg += "Unknown error occurred.";
                        }
                        reject(errMsg);
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            });
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3, p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
            const dp = (lat2 - lat1) * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        async function getAddressFromCoordinates(lat, lng) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                const data = await response.json(); 
                return data.display_name || "Coordinates captured, address unknown.";
            } catch (e) { return "Address translation failed."; }
        }

        // --- IP ADDRESS TRACKER ---
        async function getIpAddress() {
            try { 
                const res = await fetch('https://api.ipify.org?format=json'); 
                const data = await res.json(); 
                return data.ip || "Unknown IP"; 
            } 
            catch (e) { return "Unknown IP"; }
        }

        async function startCamera(type, formData, location, address) {
            hideModal();
            document.getElementById('forms-container').classList.add('hidden');
            document.getElementById('selfie-section').classList.remove('hidden');
            
            const btn = document.getElementById('capture-btn');
            btn.disabled = false; 
            btn.innerHTML = '<svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg> <span>Take Selfie</span>'; 

            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                document.getElementById('camera-feed').srcObject = cameraStream;
                document.getElementById('capture-btn').onclick = () => captureAndSubmit(type, formData, location, address);
            } catch (err) {
                showModal('Camera Error', 'Camera permission denied or not available.');
                stopCamera(); document.getElementById('forms-container').classList.remove('hidden');
            }
        }

        function captureAndSubmit(type, formData, location, address) {
            const btn = document.getElementById('capture-btn');
            // LOCK THE BUTTON SO THEY CANNOT SPAM CLICK
            btn.disabled = true; 
            btn.innerHTML = '<div class="loader mr-2 w-5 h-5 border-2 border-t-white inline-block align-middle"></div> Uploading...';
            
            const video = document.getElementById('camera-feed');
            const canvas = document.getElementById('photo-canvas');
            const context = canvas.getContext('2d');
            
            canvas.width = video.videoWidth; 
            canvas.height = video.videoHeight;
            context.translate(canvas.width, 0); 
            context.scale(-1, 1);
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            context.translate(canvas.width, 0); 
            context.scale(-1, 1);

            // --- TIMESTAMP WATERMARK (YELLOW COLOR) ---
            const dateStr = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
            context.font = "bold 20px Arial";
            context.fillStyle = "#fbbf24"; // Amber-400
            context.shadowColor = "rgba(0,0,0,0.8)";
            context.shadowBlur = 8;
            context.lineWidth = 2;
            
            // Draw semi-transparent background pill for text readability
            context.fillStyle = "rgba(0,0,0,0.5)";
            context.shadowBlur = 0;
            context.fillRect(10, canvas.height - 40, context.measureText(dateStr).width + 20, 30);
            
            context.fillStyle = "#fbbf24";
            context.shadowBlur = 8;
            context.fillText(dateStr, 20, canvas.height - 18);
            
            const selfieData = canvas.toDataURL('image/jpeg', 0.6);
            stopCamera();
            submitFinalData(type, formData, location, selfieData, address);
        }

        function stopCamera() {
            if (cameraStream) cameraStream.getTracks().forEach(track => track.stop());
            document.getElementById('selfie-section').classList.add('hidden');
        }

        async function submitFinalData(type, formData, location, selfie, address) {
            if (!currentUser) return;
            showModal('Finalizing Sync', 'Writing records securely...', false);
            
            // Fetch IP silently in background
            const ipAddress = await getIpAddress(); 

            try {
                const payload = { action: 'submit', type, ...currentUser, ...formData, ...location, selfie, address, ipAddress };
                const res = await safeFetch(payload);
                
                if (res && res.status === 'success') {
                    if (type === 'checkin') {
                        localStorage.setItem('rcisShiftState', JSON.stringify({ 
                            isShiftActive: true, currentShift: formData.shiftTime, checkInTime: new Date().getTime() 
                        }));
                    } else {
                        localStorage.removeItem('rcisShiftState');
                        activeCheckInTime = null;
                    }
                    showModal('Success!', `Aapka ${type.toUpperCase()} safaltapoorvak record ho gaya hai.`);
                    hideForms(); 
                    
                    // Delaying a bit before state refresh ensures UI stays clean
                    setTimeout(loadRiderState, 1500);
                } else {
                    // SERVER BLOCKED IT (Double Entry or Error)
                    showModal('Request Blocked', res ? res.message : 'Server verification failed.');
                    document.getElementById('forms-container').classList.remove('hidden');
                    // Ensure UI re-syncs to show correct button if they were out of sync
                    silentStateSync(); 
                }
            } catch (error) {
                showModal('Transmission Error', error.message);
                document.getElementById('forms-container').classList.remove('hidden');
            }
        }
    </script>
