<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCIS (Rider Check-In System)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        #camera-feed { transform: scaleX(-1); max-width: 100%; border-radius: 0.75rem; }
        .loader { border: 4px solid rgba(255, 255, 255, 0.2); border-radius: 50%; border-top: 4px solid #60a5fa; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .glass-card { background: rgba(23, 27, 46, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #4b5563; border-radius: 10px; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-slate-900 to-black min-h-screen flex flex-col items-center justify-center p-4 text-gray-200">
    <div class="glass-card flex flex-col items-center p-6 sm:p-8 rounded-2xl shadow-2xl max-w-2xl w-full">
        <h1 class="text-3xl sm:text-4xl font-extrabold mb-8 text-center leading-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-cyan-300">
            Rider Check-In System
        </h1>

        <!-- Login Section -->
        <div id="login-section" class="w-full max-w-md mb-8 text-center">
             <label for="rider-id" class="text-xl font-semibold text-gray-300">Enter Your ID</label>
            <input type="text" id="rider-id" placeholder="Rider / Manager ID"
                   class="mt-2 p-4 w-full text-lg text-center rounded-lg bg-slate-800 border border-slate-700 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-white placeholder-gray-400 shadow-sm uppercase">
            
            <label for="rider-pin" class="text-xl font-semibold text-gray-300 mt-4 block">Enter Your Secret PIN</label>
            <div class="relative w-full mt-2">
                <input type="password" id="rider-pin" placeholder="••••••"
                       class="p-4 w-full text-lg text-center rounded-lg bg-slate-800 border border-slate-700 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-white placeholder-gray-400 shadow-sm pr-10">
                <button onclick="togglePinVisibility()" type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-200">
                    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    <svg id="eye-slash-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                </button>
            </div>
            <button id="login-btn" onclick="loginRider()"
                   class="mt-6 w-full px-8 py-4 text-xl font-bold text-white bg-gradient-to-r from-blue-600 to-cyan-600 rounded-xl shadow-lg shadow-blue-500/30 transition-all duration-300 hover:from-blue-700 hover:to-cyan-700 transform hover:scale-105">
                Login
            </button>
        </div>

        <!-- Manager Dashboard Section -->
        <div id="manager-section" class="hidden w-full max-w-md mx-auto text-center">
            <div class="mb-4 flex justify-between items-center bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                <p class="text-lg">Manager: <span id="mgr-name" class="font-bold text-emerald-400"></span></p>
                <div class="flex space-x-3">
                    <button type="button" onclick="fetchPendingApprovals()" id="mgr-refresh-btn" class="px-3 py-2 bg-blue-900/40 border border-blue-500/30 rounded-lg text-blue-400 hover:text-blue-300 hover:bg-blue-800/50 font-semibold text-sm flex items-center transition-colors cursor-pointer disabled:opacity-50">
                        <svg id="refresh-icon" class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        <span id="mgr-refresh-text">Refresh</span>
                    </button>
                    <button type="button" onclick="logoutUser()" class="px-3 py-2 bg-rose-900/40 border border-rose-500/30 rounded-lg text-rose-400 hover:text-rose-300 hover:bg-rose-800/50 font-semibold text-sm transition-colors cursor-pointer">Logout</button>
                </div>
            </div>
            <h2 class="text-2xl font-bold text-gray-200 mb-6 border-b border-gray-700 pb-2">Pending Approvals</h2>
            
            <div id="approvals-container" class="space-y-4 max-h-96 overflow-y-auto pr-2 custom-scrollbar">
                <!-- Requests will load here via polling -->
            </div>
        </div>

        <!-- Main Rider App Section -->
        <div id="app-section" class="hidden w-full text-center">
            <div id="user-info" class="mb-8 flex justify-between items-center bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                <p class="text-xl">Welcome, <span id="user-name" class="font-bold text-blue-400"></span>!</p>
                <button onclick="logoutUser()" class="text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
            
            <p id="active-shift-display" class="hidden text-emerald-400 mb-4 bg-emerald-900/30 p-2 rounded border border-emerald-800"></p>

            <div id="buttons" class="flex flex-col sm:flex-row justify-center items-center space-y-6 sm:space-y-0 sm:space-x-8 w-full">
                <button id="check-in-button" onclick="showForm('checkin')" class="px-10 py-6 text-2xl font-bold text-white bg-gradient-to-r from-sky-500 to-cyan-500 rounded-xl shadow-lg shadow-cyan-500/20 transition-all duration-300 hover:from-sky-600 hover:to-cyan-600 transform hover:scale-105 w-full sm:w-auto" style="display: none;">
                    Check-In
                </button>
                <button id="check-out-button" onclick="showForm('checkout')" class="px-10 py-6 text-2xl font-bold text-white bg-gradient-to-r from-emerald-500 to-teal-500 rounded-xl shadow-lg shadow-teal-500/20 transition-all duration-300 hover:from-emerald-600 hover:to-teal-600 transform hover:scale-105 w-full sm:w-auto" style="display: none;">
                    Check-Out
                </button>
            </div>

            <!-- Forms Container -->
            <div id="forms-container" class="hidden w-full">
                 <div id="checkin-form" class="hidden mt-8 flex flex-col items-center space-y-4 w-full">
                    <label for="shift-time-select" class="text-xl font-semibold text-gray-300">Select Shift Time:</label>
                    <select id="shift-time-select" class="p-4 text-xl rounded-lg bg-slate-800 border border-slate-700 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-white w-full max-w-md">
                        <option value="">Select Shift Time</option>
                        <option value="7 AM to 5 PM">7 AM to 5 PM</option>
                        <option value="8 AM to 6 PM">8 AM to 6 PM</option>
                        <option value="9 AM to 7 PM">9 AM to 7 PM</option>
                        <option value="4 PM to 2 AM">4 PM to 2 AM</option>
                        <option value="8 PM to 6 AM">8 PM to 6 AM</option>
                        <option value="10 PM to 8 AM">10 PM to 8 AM</option>
                        <option value="Other (In Emergency Only)">Other (In Emergency Only)</option>
                    </select>
                    <button id="submit-checkin-btn" onclick="startVerification('checkin', this)" class="w-full max-w-md px-8 py-4 text-xl font-bold text-white bg-gradient-to-r from-sky-500 to-cyan-500 rounded-xl shadow-lg shadow-cyan-500/20 transition-all duration-300 hover:from-sky-600 hover:to-cyan-600 transform hover:scale-105">
                        Next: Verify & Submit
                    </button>
                    <button onclick="hideForms()" class="text-gray-400 mt-2 hover:text-white">Cancel</button>
                </div>

                <div id="checkout-form" class="hidden mt-8 flex flex-col items-center space-y-4 w-full max-w-md mx-auto">
                    <h2 class="text-2xl font-bold text-gray-200">Check-Out Details</h2>
                    <input type="number" id="total-rides" placeholder="Total Rides a Day *" class="p-3 w-full text-lg rounded-lg bg-slate-800 border border-slate-700 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-white placeholder-gray-400 shadow-sm">
                    <input type="number" id="total-kms" placeholder="Total Travelled Kms *" class="p-3 w-full text-lg rounded-lg bg-slate-800 border border-slate-700 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-white placeholder-gray-400 shadow-sm">
                    
                    <select id="last-order" onchange="toggleOrderIdField()" class="p-3 w-full text-lg rounded-lg bg-slate-800 border border-slate-700 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-white shadow-sm">
                        <option value="">Is this your Last Order? *</option>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                    
                    <input type="text" id="order-id" placeholder="Enter Last Order # *" class="hidden p-3 w-full text-lg rounded-lg bg-slate-800 border border-rose-500 focus:ring-2 focus:ring-rose-500 focus:border-rose-500 text-white shadow-sm">
                    
                    <input type="number" id="manual-orders" placeholder="Total Manual Orders (Optional)" class="p-3 w-full text-lg rounded-lg bg-slate-800 border border-slate-700 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-white placeholder-gray-400 shadow-sm">
                    <input type="number" id="manual-kms" placeholder="Manual KMs (Optional)" class="p-3 w-full text-lg rounded-lg bg-slate-800 border border-slate-700 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-white placeholder-gray-400 shadow-sm">
                    
                    <button id="submit-checkout-btn" onclick="startVerification('checkout', this)" class="w-full mt-4 px-8 py-4 text-xl font-bold text-white bg-gradient-to-r from-emerald-500 to-teal-500 rounded-xl shadow-lg shadow-teal-500/20 transition-all duration-300 hover:from-emerald-600 hover:to-teal-600 transform hover:scale-105">
                        Next: Verify & Submit
                    </button>
                    <button onclick="hideForms()" class="text-gray-400 mt-2 hover:text-white">Cancel</button>
                </div>
            </div>

            <!-- Approval Waiting -->
            <div id="approval-waiting-section" class="hidden mt-8 bg-slate-800/80 p-6 rounded-xl border border-yellow-500/50 shadow-xl max-w-md mx-auto text-center">
                <div class="loader mx-auto mb-4 border-t-yellow-400"></div>
                <h3 class="text-xl font-bold text-yellow-400 mb-2">Manager Approval Pending</h3>
                <p class="text-sm text-gray-300 mb-4" id="approval-reason-text"></p>
                <p class="text-xs text-gray-400 mb-4">Aapki request manager ko bhej di gayi hai. Kripya app me wait karein.</p>
                
                <button type="button" id="refresh-status-btn" onclick="checkMyApprovalStatus(window.lastTypeSent, window.lastFormDataSent)" class="px-4 py-2 bg-blue-600/30 text-blue-300 border border-blue-500 rounded text-sm hover:bg-blue-600 mb-2 w-full flex justify-center items-center">
                    <svg id="rider-refresh-icon" class="w-4 h-4 mr-1 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    Refresh Status
                </button>
                <button type="button" id="cancel-req-btn" onclick="cancelApprovalRequest()" class="px-4 py-2 bg-slate-700 text-gray-300 rounded text-sm hover:bg-slate-600 w-full">Cancel Request</button>
            </div>

            <!-- Camera -->
            <div id="selfie-section" class="hidden mt-8 flex flex-col items-center space-y-4 w-full max-w-md mx-auto">
                <h2 class="text-2xl font-bold text-gray-200">Live Selfie Verification</h2>
                <div class="w-full bg-black rounded-lg overflow-hidden shadow-inner">
                    <video id="camera-feed" autoplay playsinline class="w-full h-auto"></video>
                </div>
                <canvas id="photo-canvas" class="hidden"></canvas>
                <div class="flex w-full space-x-2">
                    <button onclick="stopCamera()" class="w-1/3 py-4 text-lg font-bold text-white bg-slate-700 rounded-xl hover:bg-slate-600">Cancel</button>
                    <button id="capture-btn" class="w-2/3 py-4 text-lg font-bold text-white bg-gradient-to-r from-rose-500 to-pink-500 rounded-xl shadow-lg shadow-rose-500/20 transition-all duration-300 hover:from-rose-600 hover:to-pink-600">Take Selfie</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Universal Modal -->
    <div id="custom-modal" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 p-4">
        <div class="glass-card p-8 rounded-xl shadow-2xl max-w-sm w-full text-center">
            <h3 id="modal-title" class="text-2xl font-bold text-gray-100 mb-4"></h3>
            <p id="modal-message" class="text-lg text-gray-300 mb-6"></p>
            <button id="modal-ok-button" onclick="hideModal()" class="px-6 py-3 text-lg font-semibold text-white bg-gradient-to-r from-blue-600 to-cyan-600 rounded-lg shadow-md shadow-blue-500/30 hover:scale-105 transform transition-transform duration-200">
                OK
            </button>
        </div>
    </div>

    <script>
        // --- YOUR WEB APP URL ---
        const APPS_SCRIPT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzxMI5XFyh9XCrC19eHlz3eUrUQ-q7BUrK5YugtTx9fGa71zrMyl-lRuicMsZXZvPThng/exec';
        
        const OFFICE_LATITUDE = 28.460845;
        const OFFICE_LONGITUDE = 77.079439;
        const ALLOWED_RADIUS_METERS = 400; 

        let currentUser = null;
        let cameraStream = null;
        let currentActiveShift = null;
        let activeCheckInTime = null;
        
        let approvalPollingTimer = null;
        let managerPollingTimer = null;

        // --- INIT ---
        window.onload = () => {
            const savedUser = localStorage.getItem('rcisCurrentUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                routeUser();
                
                // Silent state sync (Auto fix check-in/out button state)
                if(currentUser && currentUser.role === 'rider') {
                    silentStateSync();
                }
            }
        };

        // --- CORE API METHOD (Robust with auto-retry) ---
        async function safeFetch(payload, maxRetries = 2, silentError = false) {
            payload.ts = new Date().getTime(); // Anti-cache
            
            for (let attempt = 0; attempt <= maxRetries; attempt++) {
                try {
                    const response = await fetch(APPS_SCRIPT_WEB_APP_URL, {
                        method: 'POST',
                        redirect: 'follow',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    
                    const rawText = await response.text();
                    
                    try {
                        const jsonData = JSON.parse(rawText);
                        if(jsonData.status === 'error' && jsonData.message && jsonData.message.includes('Server thoda busy hai')) {
                            throw new Error(jsonData.message); 
                        }
                        return jsonData;
                    } catch(parseErr) {
                        // Agar HTML page aaya hai toh throw karo
                        throw new Error("Server thoda busy hai ya redirect hua hai. Retrying...");
                    }
                    
                } catch (error) {
                    if (attempt === maxRetries) {
                        if(!silentError) console.error("Fetch failed after retries:", error);
                        throw new Error(error.message);
                    }
                    // Wait before retry
                    await new Promise(resolve => setTimeout(resolve, 1500));
                }
            }
        }

        // --- UTILS ---
        function showModal(title, message, showOkBtn = true) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-ok-button').style.display = showOkBtn ? 'inline-block' : 'none';
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function hideModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function togglePinVisibility() {
            const pinInput = document.getElementById('rider-pin');
            pinInput.type = pinInput.type === 'password' ? 'text' : 'password';
            document.getElementById('eye-icon').classList.toggle('hidden');
            document.getElementById('eye-slash-icon').classList.toggle('hidden');
        }

        function toggleOrderIdField() {
            const lastOrder = document.getElementById('last-order').value;
            const orderIdInput = document.getElementById('order-id');
            if (lastOrder === 'Yes') {
                orderIdInput.classList.remove('hidden');
            } else {
                orderIdInput.classList.add('hidden');
                orderIdInput.value = '';
            }
        }

        // --- AUTH & ROUTING ---
        async function loginRider() {
            const riderId = document.getElementById('rider-id').value.trim().toUpperCase();
            const secretPin = document.getElementById('rider-pin').value.trim();
            const loginBtn = document.getElementById('login-btn');
            
            if (!riderId || !secretPin) {
                return showModal('Error', 'ID aur PIN dono daalein.');
            }
            
            loginBtn.disabled = true;
            loginBtn.classList.add('opacity-50');
            showModal('Logging In...', 'System checking details...', false);
            
            try {
                const result = await safeFetch({ action: 'login', riderId, secretPin });
                
                if (result && result.status === 'success' && result.data) {
                    currentUser = result.data;
                    localStorage.setItem('rcisCurrentUser', JSON.stringify(currentUser));
                    hideModal();
                    routeUser();
                    
                    if(currentUser.role === 'rider') silentStateSync();
                } else {
                    showModal('Login Failed', result ? result.message : 'ID ya PIN galat hai.');
                }
            } catch (error) {
                showModal('Error', 'Login me dikkat aayi: ' + error.message);
            } finally {
                loginBtn.disabled = false;
                loginBtn.classList.remove('opacity-50');
            }
        }

        function logoutUser() {
            localStorage.removeItem('rcisCurrentUser');
            localStorage.removeItem('rcisShiftState');
            currentUser = null;
            if (managerPollingTimer) clearInterval(managerPollingTimer);
            if (approvalPollingTimer) clearInterval(approvalPollingTimer);
            window.location.reload();
        }

        function routeUser() {
            document.getElementById('login-section').classList.add('hidden');
            
            if (currentUser.role === 'manager') {
                document.getElementById('app-section').classList.add('hidden');
                document.getElementById('manager-section').classList.remove('hidden');
                document.getElementById('mgr-name').textContent = currentUser.riderName;
                
                fetchPendingApprovals();
                if (managerPollingTimer) clearInterval(managerPollingTimer);
                managerPollingTimer = setInterval(fetchPendingApprovals, 10000);
            } else {
                document.getElementById('manager-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('user-name').textContent = currentUser.riderName;
                loadRiderState();
            }
        }

        // --- RIDER STATE SYNC ---
        async function silentStateSync() {
            try {
                const res = await safeFetch({ action: 'getShiftState', riderId: currentUser.riderId }, 2, true);
                if (res && res.status === 'success' && res.shiftState) {
                    localStorage.setItem('rcisShiftState', JSON.stringify(res.shiftState));
                    loadRiderState(); 
                }
            } catch(e) {}
        }

        function loadRiderState() {
            const stateStr = localStorage.getItem('rcisShiftState');
            document.getElementById('buttons').classList.remove('hidden');
            document.getElementById('forms-container').classList.add('hidden');

            if (stateStr) {
                const state = JSON.parse(stateStr);
                if (state.isShiftActive) {
                    currentActiveShift = state.currentShift;
                    activeCheckInTime = state.checkInTime;
                    document.getElementById('check-in-button').style.display = 'none';
                    document.getElementById('check-out-button').style.display = 'block';
                    document.getElementById('active-shift-display').innerText = 'Active Duty: ' + currentActiveShift;
                    document.getElementById('active-shift-display').classList.remove('hidden');
                    return;
                }
            }
            
            // Default
            currentActiveShift = null;
            activeCheckInTime = null;
            document.getElementById('check-in-button').style.display = 'block';
            document.getElementById('check-out-button').style.display = 'none';
            document.getElementById('active-shift-display').classList.add('hidden');
        }

        // --- RIDER FORMS ---
        function showForm(type) {
            document.getElementById('buttons').classList.add('hidden');
            document.getElementById('forms-container').classList.remove('hidden');
            if (type === 'checkin') {
                document.getElementById('checkin-form').classList.remove('hidden'); 
                document.getElementById('checkout-form').classList.add('hidden');
            } else {
                document.getElementById('checkout-form').classList.remove('hidden'); 
                document.getElementById('checkin-form').classList.add('hidden');
            }
        }
        
        function hideForms() {
            document.getElementById('forms-container').classList.add('hidden'); 
            document.getElementById('buttons').classList.remove('hidden');
        }

        function getShiftTimeBounds(shiftStr, checkInTimestamp = null) {
            if (!shiftStr) return null;
            
            // Emergency Shift: 10 hrs from actual checkin time
            if (shiftStr.includes("Other")) {
                if (!checkInTimestamp) return null;
                let start = new Date(checkInTimestamp);
                let end = new Date(checkInTimestamp);
                end.setHours(end.getHours() + 10); 
                return { start, end };
            }

            const match = shiftStr.match(/(\d{1,2})\s*(AM|PM)\s*to\s*(\d{1,2})\s*(AM|PM)/i);
            if (!match) return null;
            let startH = parseInt(match[1]), startM = match[2].toUpperCase();
            let endH = parseInt(match[3]), endM = match[4].toUpperCase();
            
            if (startM === 'PM' && startH !== 12) startH += 12; 
            if (startM === 'AM' && startH === 12) startH = 0;
            if (endM === 'PM' && endH !== 12) endH += 12; 
            if (endM === 'AM' && endH === 12) endH = 0;

            let now = new Date(), start = new Date(now), end = new Date(now); 
            start.setHours(startH, 0, 0, 0); end.setHours(endH, 0, 0, 0);
            
            if (end <= start) {
                if (now.getHours() < startH && now.getHours() < 12) start.setDate(start.getDate() - 1); 
                else end.setDate(end.getDate() + 1);
            }
            return { start, end };
        }

        function getFormData(type) {
            const data = {};
            if (type === 'checkin') {
                data.shiftTime = document.getElementById('shift-time-select').value;
                if (!data.shiftTime) { showModal('Error', 'Kripya shift time chunein.'); return null; }
            } else if (type === 'checkout') {
                data.totalRides = document.getElementById('total-rides').value;
                data.totalKms = document.getElementById('total-kms').value;
                const lastOrderRaw = document.getElementById('last-order').value;
                const orderId = document.getElementById('order-id').value.trim();
                
                if (!data.totalRides || !data.totalKms || !lastOrderRaw) {
                    showModal('Error', 'Kripya sabhi zaroori (*) fields bharein.'); return null;
                }
                if (lastOrderRaw === 'Yes') {
                    if (!orderId) { showModal('Error', 'Last Order "Yes" hai. Kripya Order ID enter karein.'); return null; }
                    data.lastOrder = "Yes"; data.orderId = `Yes (ID: ${orderId})`; 
                } else {
                    data.lastOrder = "No"; data.orderId = "N/A"; 
                }
                data.lastOrderRaw = lastOrderRaw;
                data.manualOrders = document.getElementById('manual-orders').value || "";
                data.manualKms = document.getElementById('manual-kms').value || "";
            }
            return data;
        }

        function startVerification(type, btnElement) {
            const formData = getFormData(type);
            if (!formData) return;

            const origText = btnElement.innerHTML;
            btnElement.innerHTML = "Processing...";
            btnElement.disabled = true;
            btnElement.classList.add('opacity-50');

            let shiftStr = type === 'checkin' ? formData.shiftTime : currentActiveShift;
            let bounds = getShiftTimeBounds(shiftStr, activeCheckInTime); 
            let now = new Date(), needsApproval = false, reason = "";

            if (type === 'checkin' && bounds) {
                let diffMins = (now - bounds.start) / 60000;
                if (diffMins > 20) { needsApproval = true; reason = `Late check-in by ${Math.floor(diffMins)} minutes.`; }
            } else if (type === 'checkout' && bounds) {
                let diffMinsEarly = (bounds.end - now) / 60000;
                // 30 min early check out strict rule
                if (diffMinsEarly > 30 && formData.lastOrderRaw === 'No') {
                    needsApproval = true; reason = `Early check-out by ${Math.floor(diffMinsEarly)} mins without last order.`;
                }
            } else if (shiftStr && shiftStr.includes("Other")) {
                if (type === 'checkin') {
                    needsApproval = true; reason = "Emergency/Other shift selected.";
                }
            }

            if (needsApproval) {
                requestManagerApproval(type, formData, reason, shiftStr, btnElement, origText);
            } else {
                btnElement.innerHTML = origText;
                btnElement.disabled = false;
                btnElement.classList.remove('opacity-50');
                proceedToLocation(type, formData);
            }
        }

        // --- RIDER APPROVAL POLLING ---
        async function requestManagerApproval(type, formData, reason, shiftStr, btnElement, origText) {
            try {
                await safeFetch({
                    action: 'requestApproval',
                    riderId: currentUser.riderId,
                    riderName: currentUser.riderName,
                    type: type,
                    reason: reason,
                    shiftTime: shiftStr
                }, 2);
                
                hideForms();
                document.getElementById('approval-reason-text').innerText = reason;
                document.getElementById('approval-waiting-section').classList.remove('hidden');

                window.lastTypeSent = type; 
                window.lastFormDataSent = formData;

                if(approvalPollingTimer) clearInterval(approvalPollingTimer);
                approvalPollingTimer = setInterval(() => checkMyApprovalStatus(type, formData), 5000);

            } catch(e) {
                showModal('Request Failed', 'Network error. Please try again.');
            } finally {
                if(btnElement) {
                    btnElement.innerHTML = origText;
                    btnElement.disabled = false;
                    btnElement.classList.remove('opacity-50');
                }
            }
        }

        async function checkMyApprovalStatus(type, formData) {
            const rIcon = document.getElementById('rider-refresh-icon');
            const rBtn = document.getElementById('refresh-status-btn');
            if(rIcon) { rIcon.classList.remove('hidden'); rIcon.classList.add('animate-spin'); }
            if(rBtn) rBtn.disabled = true;

            try {
                const res = await safeFetch({ action: 'checkApprovalStatus', riderId: currentUser.riderId }, 0, true);
                if (res && res.status === 'success') {
                    if (res.approvalStatus === 'approved') {
                        if(approvalPollingTimer) clearInterval(approvalPollingTimer);
                        document.getElementById('approval-waiting-section').classList.add('hidden');
                        showModal('Approved!', 'Manager ne request approve kar di hai. Location verify ho rahi hai.', false);
                        setTimeout(() => { hideModal(); proceedToLocation(type, formData); }, 2000);
                    } else if (res.approvalStatus === 'rejected') {
                        if(approvalPollingTimer) clearInterval(approvalPollingTimer);
                        document.getElementById('approval-waiting-section').classList.add('hidden');
                        showModal('Rejected', 'Manager ne aapki request deny kar di hai. Aap abhi submit nahi kar sakte.');
                        document.getElementById('forms-container').classList.remove('hidden');
                    }
                }
            } catch(e) { 
            } finally {
                if(rIcon) { rIcon.classList.add('hidden'); rIcon.classList.remove('animate-spin'); }
                if(rBtn) rBtn.disabled = false;
            }
        }

        async function cancelApprovalRequest() {
            const cBtn = document.getElementById('cancel-req-btn');
            cBtn.disabled = true; cBtn.innerHTML = "Cancelling...";

            if (approvalPollingTimer) clearInterval(approvalPollingTimer);
            document.getElementById('approval-waiting-section').classList.add('hidden');
            document.getElementById('forms-container').classList.remove('hidden');

            try { await safeFetch({ action: 'cancelApproval', riderId: currentUser.riderId }, 1, true); } catch(e) {}
            cBtn.disabled = false; cBtn.innerHTML = "Cancel Request";
        }

        // --- MANAGER DASHBOARD FUNCTIONS ---
        async function fetchPendingApprovals() {
            const refreshBtn = document.getElementById('mgr-refresh-btn');
            const refreshIcon = document.getElementById('refresh-icon');
            
            if (refreshBtn) refreshBtn.disabled = true;
            if (refreshIcon) refreshIcon.classList.add('animate-spin');

            try {
                const result = await safeFetch({ action: 'getPendingApprovals' }, 0, true); 
                const container = document.getElementById('approvals-container');
                container.innerHTML = '';
                
                if(result && result.status === 'success') {
                    if (result.data.length === 0) {
                        container.innerHTML = '<p class="text-sm text-gray-400 p-4 border border-gray-700 rounded bg-slate-800/50">Koi pending approval request nahi hai.</p>';
                    } else {
                        result.data.forEach(data => {
                            container.innerHTML += `
                                <div class="bg-slate-800 p-4 rounded-xl border border-slate-600 shadow-md text-left transition-all">
                                    <p class="font-bold text-white text-lg">${data.riderName} <span class="text-sm text-blue-400">(${data.riderId})</span></p>
                                    <p class="text-sm font-semibold mt-1 ${data.type==='checkin' ? 'text-yellow-400' : 'text-emerald-400'}">${data.type.toUpperCase()} Request</p>
                                    <p class="text-xs text-gray-300 mt-2 bg-slate-900 p-2 rounded border border-rose-500/30">Reason: ${data.reason}</p>
                                    <p class="text-xs text-gray-400 mt-1">Shift: ${data.shiftTime}</p>
                                    <div class="flex space-x-2 mt-4">
                                        <button onclick="respondApproval(this, ${data.rowNumber}, 'approved')" class="flex-1 py-3 font-bold bg-emerald-600/20 text-emerald-400 border border-emerald-600 rounded-lg hover:bg-emerald-600 hover:text-white transition cursor-pointer">Approve</button>
                                        <button onclick="respondApproval(this, ${data.rowNumber}, 'rejected')" class="flex-1 py-3 font-bold bg-rose-600/20 text-rose-400 border border-rose-600 rounded-lg hover:bg-rose-600 hover:text-white transition cursor-pointer">Reject</button>
                                    </div>
                                </div>
                            `;
                        });
                    }
                }
            } catch(e) { 
            } finally {
                if (refreshIcon) refreshIcon.classList.remove('animate-spin'); 
                if (refreshBtn) refreshBtn.disabled = false;
            }
        }

        window.respondApproval = async function(btn, rowNum, statusResponse) {
            const originalText = btn.innerHTML;
            btn.innerHTML = "Wait..."; 
            btn.disabled = true; 
            btn.classList.add('opacity-50');
            try {
                const res = await safeFetch({ action: 'respondApproval', rowNumber: rowNum, statusResponse: statusResponse }, 1);
                if(res && res.status === 'success') {
                    fetchPendingApprovals(); 
                } else {
                    showModal('Error', res ? res.message : 'Unknown error');
                    btn.innerHTML = originalText; btn.disabled = false; btn.classList.remove('opacity-50');
                }
            } catch(e) { 
                showModal('Error', e.message); 
                btn.innerHTML = originalText; btn.disabled = false; btn.classList.remove('opacity-50');
            }
        };

        // --- LOCATION & CAMERA ---
        function proceedToLocation(type, formData) {
            showModal('Verifying Location...', 'Aapki location check ki ja rahi hai...', false);
            getLocation().then(async location => {
                showModal('Fetching Address...', 'Address check kiya ja raha hai...', false);
                const address = await getAddressFromCoordinates(location.latitude, location.longitude);
                startCamera(type, formData, location, address);
            }).catch(error => { 
                showModal('Location Error', error); 
                document.getElementById('forms-container').classList.remove('hidden');
            });
        }

        function getLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) return reject('Geolocation support nahi hai.');
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        const { latitude, longitude } = pos.coords;
                        const dist = calculateDistance(latitude, longitude, OFFICE_LATITUDE, OFFICE_LONGITUDE);
                        if (dist <= ALLOWED_RADIUS_METERS) resolve({ latitude, longitude });
                        else reject(`Aap office se lagbhag ${dist.toFixed(0)} meter door hain.`);
                    },
                    () => reject('Location permission nahi mili. Please location chalu karein.'),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            });
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3, φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180, Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        async function getAddressFromCoordinates(lat, lng) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                const data = await response.json();
                return data.display_name || "Address not found.";
            } catch (e) { return "Could not fetch address."; }
        }

        async function startCamera(type, formData, location, address) {
            hideModal();
            document.getElementById('forms-container').classList.add('hidden');
            document.getElementById('selfie-section').classList.remove('hidden');
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                document.getElementById('camera-feed').srcObject = cameraStream;
                document.getElementById('capture-btn').onclick = () => captureAndSubmit(type, formData, location, address);
            } catch (err) {
                showModal('Camera Error', 'Camera permission dein.');
                stopCamera(); document.getElementById('forms-container').classList.remove('hidden');
            }
        }

        function captureAndSubmit(type, formData, location, address) {
            const btn = document.getElementById('capture-btn');
            btn.disabled = true; btn.innerHTML = "Processing...";
            
            const video = document.getElementById('camera-feed');
            const canvas = document.getElementById('photo-canvas');
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const selfieData = canvas.toDataURL('image/jpeg', 0.6);
            stopCamera();
            submitFinalData(type, formData, location, selfieData, address);
            
            setTimeout(() => { btn.disabled = false; btn.innerHTML = "Take Selfie"; }, 2000);
        }

        function stopCamera() {
            if (cameraStream) cameraStream.getTracks().forEach(track => track.stop());
            document.getElementById('selfie-section').classList.add('hidden');
        }

        async function submitFinalData(type, formData, location, selfie, address) {
            if (!currentUser) return;
            showModal('Saving...', 'Data Google Sheet me save ho raha hai...', false);

            try {
                const payload = { action: 'submit', type, ...currentUser, ...formData, ...location, selfie, address };
                const res = await safeFetch(payload);
                
                if (res.status === 'success') {
                    if (type === 'checkin') {
                        localStorage.setItem('rcisShiftState', JSON.stringify({ 
                            isShiftActive: true, 
                            currentShift: formData.shiftTime,
                            checkInTime: new Date().getTime() 
                        }));
                    } else {
                        localStorage.removeItem('rcisShiftState');
                        activeCheckInTime = null;
                    }
                    
                    showModal('Success!', `Aapka ${type} safaltapoorvak record ho gaya hai.`);
                    hideForms();
                    loadRiderState(); 
                } else {
                    showModal('Error', 'Sheet me save nahi hua: ' + res.message);
                    document.getElementById('forms-container').classList.remove('hidden');
                }
            } catch (error) {
                showModal('Error', 'Submit error: ' + error.message);
                document.getElementById('forms-container').classList.remove('hidden');
            }
        }
    </script>
